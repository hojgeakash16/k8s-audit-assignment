# Replaces 12-gateway-api.yml and 13-envoyproxy.yml from k8s/eks.
# Needs ingress-nginx and a cluster made with kind/kind-config.yaml (80/443 mapped).
# localtest.me resolves to 127.0.0.1.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devboard
  namespace: devboard-ns
spec:
  ingressClassName: nginx
  rules:
    - host: devboard.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
